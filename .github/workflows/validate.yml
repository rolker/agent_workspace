name: Workspace Validation

"on":
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  validate-scripts:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lint
        env:
          SKIP: check-commit-identity,no-commit-to-branch,check-branch-updates,verify-issue-branch
        run: make lint

  validate-adapter-contract:
    name: Validate Adapter Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install repos-manifest (the resolver the ros2_colcon adapter calls)
        run: pip install -e tools/repos-manifest
      - run: repos-manifest --help

      - name: Validate project-type adapters (ADR-0011)
        run: bash .agent/scripts/validate_adapter.sh

      - name: Run adapter tests
        run: bash .agent/scripts/tests/test_adapter.sh

      - name: Run project registry tests
        run: bash .agent/scripts/tests/test_project_registry.sh

      - name: Run ros2_colcon adapter tests
        run: bash .agent/scripts/tests/test_ros2_colcon.sh

  validate-repos-manifest:
    name: repos-manifest tests (#267 prototype) (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install repos-manifest (editable, with test extras)
        run: pip install -e tools/repos-manifest[test]

      # The tests of `build` marked `colcon` build small CMake packages with the real colcon;
      # with REPOS_MANIFEST_REQUIRE_COLCON=1 a missing colcon or cmake fails them, not skips.
      - name: Install colcon (for the build tests)
        run: |
          pip install colcon-common-extensions
          command -v colcon
          cmake --version

      - name: Run tests
        env:
          REPOS_MANIFEST_REQUIRE_COLCON: '1'
        run: pytest tools/repos-manifest/tests

  validate-documentation:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for required documentation
        run: |
          required_files="README.md docs/design.md AGENTS.md"
          for file in $required_files; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required documentation files present"
