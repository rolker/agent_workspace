name: Workspace Validation

"on":
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  validate-scripts:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lint
        env:
          SKIP: check-commit-identity,no-commit-to-branch,check-branch-updates,verify-issue-branch
        run: make lint

  validate-adapter-contract:
    name: Validate Adapter Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project-type adapters (ADR-0011)
        run: bash .agent/scripts/validate_adapter.sh

      - name: Run adapter tests
        run: bash .agent/scripts/tests/test_adapter.sh

      - name: Run project registry tests
        run: bash .agent/scripts/tests/test_project_registry.sh

      - name: Run ros2_colcon adapter tests
        run: bash .agent/scripts/tests/test_ros2_colcon.sh

  validate-ros-manifest:
    name: ros-manifest tests (#267 prototype)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ros-manifest (editable, with test extras)
        run: pip install -e tools/ros-manifest[test]

      - name: Run tests
        run: pytest tools/ros-manifest/tests

  validate-documentation:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for required documentation
        run: |
          required_files="README.md ARCHITECTURE.md AGENTS.md"
          for file in $required_files; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required documentation files present"
