[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repos-manifest"
version = "0.1.0"
description = "Prototype general ROS 2 multi-repo manifest resolver (extraction candidate, see agent_workspace issue #267)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "vcs2l>=1.1.7",
]

[project.scripts]
repos-manifest = "repos_manifest.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
