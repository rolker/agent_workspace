# Test data for repos-manifest: project11's manifest in the format of docs/spec.md.
#
# Copied from a draft made on 2026-11-18 from the layer files on the `jazzy` branch of
# rolker/unh_marine_autonomy (config/repos/*.repos). The group names are the author's
# guesses and the URLs are not the released ones. This file is a fixture: it need not
# follow later changes to the real manifest.
#
# Long lists of the draft are written one item per line here; their content is unchanged.
format: 1

distros: [jazzy, rolling]

layers:
  - underlay
  - core
  - platforms
  - site
  - sensors
  - simulation
  - ui

groups:
  - simulation
  - ui
  - sonar-drivers
  - ben-hardware
  - drix-hardware
  - lr30-hardware
  - echoboat-hardware
  - unh-echoboat-hardware
  - mobile-lab

roles:
  robot: []
  operator: [ui]
  developer:
    - simulation
    - ui
    - sonar-drivers
    - ben-hardware
    - drix-hardware
    - lr30-hardware
    - echoboat-hardware
    - unh-echoboat-hardware
    - mobile-lab

repositories:
  ros2launch_gui:
    type: git
    url: https://github.com/rolker/ros2launch_gui.git
    version: jazzy
    layer: underlay
