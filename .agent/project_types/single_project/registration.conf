# What register_project.sh does for a single_project (issue #332). Read
# by registration_conf_get in .agent/scripts/_project_registry.sh, whose
# header for this file names the keys; validate_adapter.sh checks every
# type has one. Data, so no script branches on the type name.
#
# The project's own build and test commands (or 'none') are required: a
# fall-through to the shared .agent/project_config.sh, or no test command
# at all, is refused by registration_verify.sh.
required_commands=build test
# The clone is the user's: registration never clones or sets it up; the
# static gate's `adapter validate` checks it is a git repository.
setup=never
# Run after the static gate, before the project counts as registered.
run=build test
