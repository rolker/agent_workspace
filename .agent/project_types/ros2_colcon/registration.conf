# What register_project.sh does for a ros2_colcon project (issue #332).
# Read by registration_conf_get in .agent/scripts/_project_registry.sh,
# whose header for this file names the keys; validate_adapter.sh checks
# every type has one. Data, so no script branches on the type name.
#
# colcon owns build and test (they are in this type's unused_settings), so
# no command is required of the project.
required_commands=none
# A hosting directory that does not exist yet is bootstrapped by `adapter
# setup` from the project's bootstrap_url, before the static gate; one that
# exists is never set up by registration (run `adapter --project <name>
# setup` yourself).
setup=when-missing
# The static gate's `adapter validate` (manifest and checkouts) is the
# check; a full colcon build is left to the user.
run=none
