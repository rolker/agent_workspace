# What register_project.sh does for a ros2_colcon project (issue #332).
# Read by registration_conf_get in .agent/scripts/_project_registry.sh,
# whose header for this file names the keys; validate_adapter.sh checks
# every type has one. Data, so no script branches on the type name.
#
# colcon owns build and test (they are in this type's unused_settings), so
# no command is required of the project.
required_commands=none
# A hosting directory that does not exist yet is bootstrapped by `adapter
# setup` from the project's bootstrap_url before the static gate (the
# settings keys source, source_ref and source_path are read by no route:
# a --set of them is refused before anything is written, through this
# type's registration_refused, and on a registered root the adapter
# refuses them at use); one that
# exists is never set up by registration (run `adapter --project <name>
# setup` yourself), except with --manifest (below), which sets up a
# missing or empty one. A root the manifest tool set up (.repos-manifest/,
# issue 503) exists already, so registration runs no setup for it.
setup=when-missing
# The static gate's `adapter validate` (manifest and checkouts) is the
# check; a full colcon build is left to the user.
run=none
# register_project.sh <path> --manifest <file> --distro <d> [--role <r>]
# [--with <group>]... [--fetch-from <prefix>] sets a new, empty root up
# from a manifest file on the local disk: `adapter setup` with those
# arguments runs the manifest tool's init --distro-dirs --yes in the root.
# Nothing about the manifest is recorded in the workspace; the tool's
# .repos-manifest/ is the one record (issue 503 part 2). A manifest given
# as a URL or a git location is refused until the tool reads one (issue
# 498).
manifest=local-file
